<div class="shell" [class.wide]="wide()">
  @if (wide()) {
  <lister-navigation-rail class="nav" [destinations]="destinations">
    @defer (on idle) {
    <lister-sync-indicator [compact]="true" />
    }
  </lister-navigation-rail>
  } @else {
  <header class="top-bar">
    <mat-toolbar>
      <span class="brand">{{ title() }}</span>
      <span class="spacer"></span>
      @defer (on idle) {
      <lister-sync-indicator />
      }
    </mat-toolbar>
  </header>
  <lister-navigation-bar class="nav" [destinations]="destinations" />
  }
  <main #content class="content">
    <router-outlet />
  </main>
</div>
