<h1>First-run setup</h1>
<p class="lead">
  Create the first account, an administrator. The setup token is in the server's
  log from when it started.
</p>
<lister-account-form
  tokenLabel="Setup token"
  tokenMissing="Enter the setup token from the server log"
  submitLabel="Create account"
  [busy]="busy()"
  [error]="error()"
  (submitted)="setUp($event)"
/>
<p class="alt">Already have an account? <a routerLink="/sign-in">Sign in</a></p>
