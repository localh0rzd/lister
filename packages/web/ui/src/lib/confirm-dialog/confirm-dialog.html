<h2 mat-dialog-title>{{ data.heading }}</h2>
<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton type="button" mat-dialog-close cdkFocusInitial>
    Cancel
  </button>
  <button matButton="filled" type="button" [mat-dialog-close]="true">
    {{ data.confirm }}
  </button>
</mat-dialog-actions>
