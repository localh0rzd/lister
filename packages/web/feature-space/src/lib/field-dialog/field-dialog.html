<h2 mat-dialog-title>{{ data.heading }}</h2>
<form novalidate (submit)="save($event)">
  <mat-dialog-content>
    <mat-form-field class="field">
      <mat-label>{{ data.label }}</mat-label>
      <input
        matInput
        [formField]="fieldForm.value"
        autocomplete="off"
        autocapitalize="none"
        spellcheck="false"
        cdkFocusInitial
      />
      @if (data.hint) {
        <mat-hint>{{ data.hint }}</mat-hint>
      }
      @if (fieldForm.value().touched() && fieldForm.value().errors()[0]; as e) {
        <mat-error>{{ e.message }}</mat-error>
      }
    </mat-form-field>
    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button matButton type="button" mat-dialog-close>Cancel</button>
    <button matButton="filled" type="submit" [disabled]="busy()">
      {{ data.confirm }}
    </button>
  </mat-dialog-actions>
</form>
