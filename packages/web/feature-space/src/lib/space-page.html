<h1 class="page-title">Space</h1>

<section aria-labelledby="appearance-heading">
  <h2 id="appearance-heading">Appearance</h2>
  <lister-theme-picker
    [value]="theme.preference()"
    (valueChange)="theme.setPreference($event)"
  />
</section>

<section aria-labelledby="data-heading">
  <h2 id="data-heading">Data</h2>
  <a class="row-link" routerLink="trash">
    <mat-icon aria-hidden="true">delete</mat-icon>
    <span class="row-text">
      <span>Trash</span>
      <span class="row-hint"
        >Deleted lists and items, for {{ keepDays }} days</span
      >
    </span>
    <mat-icon aria-hidden="true">chevron_right</mat-icon>
  </a>
</section>

<section aria-labelledby="about-heading">
  <h2 id="about-heading">About</h2>
  <p>
    API status: @if (health.isLoading()) {
    <span>checking…</span>
    } @else if (health.error()) {
    <span class="down">unreachable</span>
    } @else if (health.hasValue()) {
    <span class="ok">{{ health.value().status }}</span>
    }
  </p>
</section>
